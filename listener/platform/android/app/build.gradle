plugins {
    id 'com.android.application'
}

// CMake fetches the fonts into listener/assets/fonts at configure time (cmake/Fonts.cmake), so the
// copy into the APK runs after the native configure. They ride as assets/assets/fonts/*: the app
// sees "assets" as its assets dir, as on the desktop, and reads them through SDL's IO.
def generatedAssets = layout.buildDirectory.dir('generated/orbis-assets')

android {
    namespace = 'dev.orbis.listener'
    compileSdk = 35
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId = 'dev.orbis.listener'
        minSdk = 26 // adaptive icons; AAudio-free, Vulkan 1.0 at the earliest
        targetSdk = 35
        versionCode = 1
        versionName = '0.1'
        externalNativeBuild {
            cmake {
                targets 'listener'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                // x86_64 for a PC emulator: -PorbisAbis=arm64-v8a,x86_64
                abiFilters(*(project.findProperty('orbisAbis') ?: 'arm64-v8a').split(','))
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file('../../../CMakeLists.txt')
            version = '3.31.6'
        }
    }

    sourceSets.main.assets.srcDir generatedAssets

    buildTypes {
        release {
            // No signingConfig here: the keystore is the owner's. See listener/README.md.
            minifyEnabled = false
        }
    }

    lint {
        abortOnError = false
    }

    applicationVariants.all { variant ->
        def name = variant.name.capitalize()
        def fonts = tasks.register("copy${name}Fonts", Sync) {
            dependsOn "externalNativeBuild${name}"
            into generatedAssets.map { it.dir('assets') }
            from('../../../assets') { include 'server-96.png' }
            from('../../../assets/fonts') {
                include '*.ttf', '*-OFL.txt'
                into 'fonts'
            }
        }
        tasks.named("merge${name}Assets") { dependsOn fonts }
        tasks.matching { it.name =~ /(?i)lint/ && it.name.contains(name) }.configureEach { dependsOn fonts }
    }
}
