// The Android shell around the listener: SDL's android-project, pinned to the same SDL as
// cmake/Dependencies.cmake. The C++ is the same tree as macOS and iOS (app/build.gradle).
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
